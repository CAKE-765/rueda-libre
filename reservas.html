<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | Rueda Libre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./reservas.css">
</head>

<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="./index.html">
                <img src="./img/image.jpeg" alt="Logo de Rueda Libre" width="48" height="48" class="rounded-circle">
                <span>Rueda Libre</span>
            </a>
            <div class="navbar-nav flex-row flex-wrap gap-2">
                <a class="nav-link" href="./index.html">Inicio</a>
                <a class="nav-link" href="./tarifa.html">Tarifas y precios</a>
                <a class="nav-link active" aria-current="page" href="./reservas.html">Reservas</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <header class="text-center mb-4">
            <h1 class="display-5 fw-bold">Reservas</h1>
            <p class="lead mb-0">Completa tus datos y elige tu alquiler.</p>
        </header>

        <section class="reservation-card p-3 p-md-4 rounded-3 mx-auto">
            <form action="./index.html" method="get">
                <fieldset class="border rounded-3 p-3 mb-4">
                    <legend class="float-none w-auto px-2 fs-5">Tus datos</legend>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required minlength="3"
                                maxlength="50">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="documento" class="form-label">Documento</label>
                            <input type="text" class="form-control" id="documento" name="documento" required
                                inputmode="numeric" pattern="[0-9]{6,10}">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="correo" name="correo" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="celular" class="form-label">Celular</label>
                            <input type="tel" class="form-control" id="celular" name="celular" required
                                pattern="3[0-9]{9}" title="Ingresa 10 dígitos y comienza por 3.">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="border rounded-3 p-3 mb-4">
                    <legend class="float-none w-auto px-2 fs-5">Tu alquiler</legend>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="fecha" class="form-label">Fecha de alquiler</label>
                            <input type="date" class="form-control" id="fecha" name="fecha" required
                                min="2026-11-01" max="2026-12-31">
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="tipo" class="form-label">Tipo de bicicleta</label>
                            <select class="form-select" id="tipo" name="tipo" required>
                                <option value="">Selecciona un tipo</option>
                                <option value="montaña">Montaña</option>
                                <option value="carretera">Carretera</option>
                                <option value="eléctrica">Eléctrica</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="plan" class="form-label">Plan de alquiler</label>
                            <select class="form-select" id="plan" name="plan" required>
                                <option value="">Selecciona un plan</option>
                                <option value="hora">Por hora</option>
                                <option value="dia">Por día</option>
                                <option value="semana">Por semana</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="cantidad" class="form-label">Cantidad de bicicletas</label>
                            <input type="number" class="form-control" id="cantidad" name="cantidad" required min="1"
                                max="6">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="border rounded-3 p-3 mb-4">
                    <legend class="float-none w-auto px-2 fs-5">Confirmación</legend>
                    <div class="mb-3">
                        <label for="comentarios" class="form-label">Comentarios adicionales</label>
                        <textarea class="form-control" id="comentarios" name="comentarios" rows="4"
                            maxlength="300"></textarea>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="politicas" name="politicas" required>
                        <label class="form-check-label" for="politicas">Acepto las políticas de privacidad</label>
                    </div>
                </fieldset>

                <button type="submit" class="btn btn-warning"
                    onclick="return confirm('¿Estás seguro de que deseas enviar la reserva?');">Enviar reserva</button>
            </form>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="container mb-0">&copy; 2024 Rueda Libre. ruedalibre@gmail.com. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
